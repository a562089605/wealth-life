<!doctype html><meta charset="utf-8"><title>汽车保险隔离验收</title><style>body{margin:0;background:#eee5cf;font:13px sans-serif}aside{width:230px;padding:10px;box-sizing:border-box}button{display:block;padding:8px;margin:8px 0}iframe{position:absolute;left:230px;top:0;width:800px;height:100vh;border:0}pre{white-space:pre-wrap}</style><aside><b>独立QA新档，非用户存档</b><button onclick="runChecks()">运行车险回归</button><button onclick="preview()">查看车险</button><button onclick="layoutChecks()">检查布局</button><button onclick="preview();present()">仅显示车险画面</button><button onclick="receiptPreview();present()">仅显示合并回执</button><pre id="results"></pre><pre id="layout"></pre></aside><iframe id="frame" src="../index.html"></iframe><script>
const frame=document.getElementById('frame'),out=document.getElementById('results'),w=()=>frame.contentWindow,ev=s=>w().eval(s);let base;
const check=(ok,msg)=>{if(!ok)throw Error(msg)},primary=()=>w().document.querySelector('.event-active .insurance-document-action'),button=t=>[...w().document.querySelectorAll('.event-active button')].find(b=>b.textContent===t),event=()=>({preventDefault(){},stopPropagation(){}});

function receiptPreview(){const g=reset();g.eval('state.housing="shared";RentersRules.pay(state,"basic");AutoInsuranceRules.pay(state,"basic");RentersRules.assess(state,()=>0);AutoInsuranceRules.assess(state,()=>0)');g.openHouseholdIncidents(false);}
async function runChecks(){const results=[],g=w(),random=g.Math.random,pass=x=>{results.push(x);out.textContent=JSON.stringify({running:true,results},null,2)};try{
 reset();g.openInsurance();button('汽车保险')?.click();if(g.document.getElementById('eventTitle').textContent!=='汽车保险保障选择')g.openInsurance('auto');check(ev('state.cash')===20000&&!ev('state.insurance.auto'),'view charged');check(!!g.document.querySelector('[data-document-kind="auto"]'),'no art');button('选择基础车险').click();check(ev('state.cash')===20000,'preview charged');const stale=primary().onclick;primary().click();stale(event());check(ev('state.cash')===19900&&ev('AutoInsuranceRules.covered(state)'),'activation');pass('嵌画/预览无扣款/基础100投保/旧按钮不重复扣');
 reset();g.openInsurance('auto');button('选择全赔车险').click();const closed=primary().onclick;g.clearModals();closed(event());check(ev('state.cash')===20000,'closed callback');g.openInsurance('auto');button('选择全赔车险').click();const cross=primary().onclick;g.eval('state=JSON.parse(JSON.stringify(state))');cross(event());check(ev('state.cash')===20000,'cross save');pass('关闭及跨档旧确认失效');
 reset();g.eval('state.carOwned=false');g.openInsurance('auto');check(button('选择基础车险').disabled,'no vehicle eligibility');g.eval('state.carOwned=true;state.insurance.auto={active:true,monthly:150};syncFinance()');g.openInsurance('auto');primary().click();check(ev('state.cash')===19850&&ev('state.insurance.auto.autoPlan')==='full','legacy price');pass('无车不可投保/旧150合同保留并对应全赔');
 reset();g.eval('AutoInsuranceRules.pay(state,"basic")');g.openInsurance('auto');button('预约下月切换至全赔车险').click();check(ev('state.insurance.auto.monthly')===100&&ev('state.cash')===19900,'early upgrade');button('撤销下月预约').click();check(!ev('state.autoInsurance.pending'),'revoke');button('预约下月切换至全赔车险').click();g.eval('state.month++;syncFinance()');check(ev('AutoInsuranceRules.due(state)')===165&&!ev('AutoInsuranceRules.covered(state)'),'next full');g.openInsurance('auto');primary().click();check(ev('state.cash')===19735,'full renew');primary().click();check(ev('state.autoInsurance.pending.plan')===null,'stop pending');g.eval('state.month++;syncFinance()');check(!ev('state.insurance.auto.active'),'stop effect');pass('升档/撤销/次月收费/停保次月生效不退费');
 reset();g.eval('state.insurance={health:{active:true,monthly:220},life:{active:true,monthly:35},auto:{active:true,monthly:150}};state.monthlyPayments={month:state.month,premiums:300};syncFinance()');check(ev('InsuranceRules.quote(state).due')===105,'legacy joint partial due');g.eval('payMonthly("premiums",InsuranceRules.quote(state).due);syncFinance()');check(ev('state.cash')===19895&&ev('InsuranceRules.quote(state).due')===0&&ev('LifeInsuranceRules.covered(state)&&AutoInsuranceRules.covered(state)'),'legacy joint double');pass('医疗/人寿/旧车险共用部分回执，105缺额只付一次');
 reset();g.eval('state.housing="shared";state.insurance={health:{active:true,monthly:220}};AutoInsuranceRules.pay(state,"basic");LifeInsuranceRules.pay(state);RentersRules.pay(state,"basic");syncFinance();');const expenses=ev('state.expenses');g.eval('syncFinance();syncFinance()');check(ev('state.expenses')===expenses,'sync expense drift');check(ev('InsuranceRules.quote(state).due')===220,'receipt cross credit');g.eval('payMonthly("premiums",220);state.month++;syncFinance();payMonthly("premiums",InsuranceRules.quote(state).due);syncFinance()');check(ev('InsuranceRules.quote(state).due')===0&&ev('AutoInsuranceRules.covered(state)&&LifeInsuranceRules.covered(state)&&RentersRules.covered(state)'),'shared renewal');check(ev('state.cash')===19250,'shared amount 375 twice');pass('医疗220/人寿35/租客20/基础车100共享375续费，反复同步费用稳定');
 reset();g.eval('state.housing="shared";RentersRules.pay(state,"basic");AutoInsuranceRules.pay(state,"basic");state.cash=2459;');g.Math.random=()=>0;review(g);g.settleMonth();check(ev('AutoInsuranceRules.combined(state).total')===2460&&primary().disabled,'aggregate missing');check(ev('state.cash')===2459&&ev('state.month')===0,'partial debit');const rolls=ev('JSON.stringify([state.rentersIncidents,state.autoIncidents])');g.eval('state=JSON.parse(JSON.stringify(state));state.cash=2460');g.clearModals();g.openGame();check(ev('JSON.stringify([state.rentersIncidents,state.autoIncidents])')===rolls,'reload reroll');primary().click();check(ev('state.cash')===0&&ev('AutoInsuranceRules.combined(state).paid'),'atomic pay');const paid=primary().onclick;paid(event());check(ev('state.financeLedger.filter(x=>x.kind==="autoIncidentPayment").length')===1,'duplicate debit');pass('租客1460+车1000整批2460，缺1不部分扣/读档锁定/仅付一次');
 reset();g.eval('AutoInsuranceRules.assess(state,()=>0);AutoInsuranceRules.pay(state,"full")');check(ev('state.autoIncidents[state.month].total')===5000,'retro coverage');g.eval('state.carOwned=false;syncFinance()');check(ev('state.autoIncidents[state.month].total')===5000,'vehicle snapshot changed');pass('补投全赔及车辆变化不能重算事故快照');
 reset();g.eval('AutoInsuranceRules.pay(state,"full");state.cash=0');g.Math.random=()=>0;review(g);g.settleMonth();check(!primary().disabled&&ev('AutoInsuranceRules.combined(state).total')===0,'zero total blocked');const attributes=ev('JSON.stringify([state.health,state.energy,state.stress,state.carValue])');primary().click();check(ev('state.cash')===0&&ev('JSON.stringify([state.health,state.energy,state.stress,state.carValue])')===attributes,'full extra effects');g.Math.random=()=>.99;primary().click();check(ev('state.month')===1,'monthly continuation');pass('全赔0现金结清/不改属性车值/真实月结继续一次');
 reset();g.eval('state.cash=0');g.openInsurance('auto');button('选择基础车险').click();check(primary().disabled,'low balance enabled');button('前往银行筹款').click();button('取消').click();check(ev('state.cash')===0&&!ev('state.insurance.auto'),'bank cancel');button('前往银行筹款').click();button('确认贷款').click();primary().click();check(ev('state.cash')===0&&ev('AutoInsuranceRules.covered(state)')&&ev('state.loans.at(-1).principal')===100,'bank purchase');pass('银行取消不扣款/主动贷款100返回真实投保');
 preview();await Promise.all([...g.document.querySelectorAll('.event-active img')].map(i=>i.decode()));out.textContent=JSON.stringify({passed:true,groups:results.length,results,limits:['独立QA新档和显式fixture','非真机/连续多年/完整断网']},null,2);
}catch(e){out.textContent=JSON.stringify({passed:false,error:String(e),results},null,2)}finally{g.Math.random=random;}}
async function layoutChecks(){const rows=[];try{for(const width of [320,390,800])for(const page of ['policy','receipt']){frame.style.width=width+'px';const g=reset();if(page==='policy')g.openInsurance('auto');else{g.eval('AutoInsuranceRules.assess(state,()=>0)');g.openHouseholdIncidents(false);}await new Promise(requestAnimationFrame);const d=g.document;await Promise.all([...d.querySelectorAll('.event-active img')].map(i=>i.decode()));const b=d.querySelector('.insurance-document-action'),r=b.getBoundingClientRect();check(d.documentElement.scrollWidth<=width,'overflow');check(r.height>=44&&r.left>=0&&r.right<=width,'button bounds');rows.push({width,page,buttonHeight:r.height,imagesLoaded:true,horizontalOverflow:false});}document.getElementById('layout').textContent=JSON.stringify({passed:true,rows},null,2);}catch(e){document.getElementById('layout').textContent=JSON.stringify({passed:false,error:String(e),rows},null,2)}finally{frame.style.width='390px';preview();}}
</script>
