<!doctype html><meta charset="utf-8"><title>租客险隔离验收</title>
<style>body{margin:0;font:13px sans-serif;background:#eee5cf}aside{width:235px;padding:10px;box-sizing:border-box}button{display:block;margin:6px 0;padding:8px}iframe{position:absolute;left:235px;top:0;width:800px;height:100vh;border:0}pre{white-space:pre-wrap;font-size:11px}</style>
<aside><b>独立测试档，不读取用户设备存档</b><p>先在右侧新建咖啡师试玩档。</p><button onclick="startQA()">建立独立测试档并执行回归</button><button onclick="policyPreview()">查看租客险画面</button><button onclick="receiptPreview()">查看事故回执画面</button><button onclick="frame.style.width='320px'">视口320</button><button onclick="frame.style.width='390px'">视口390</button><button onclick="frame.style.width='800px'">视口800</button><button onclick="measureLayout()">检查三种宽度与两种画面</button><button onclick="policyPreview();document.querySelector('aside').hidden=true;frame.style.left='0';frame.style.width='100vw';">仅显示游戏预览</button><pre id="layout"></pre><pre id="results"></pre></aside><iframe id="frame" src="../index.html"></iframe>
<script>
const frame=document.getElementById('frame'),out=document.getElementById('results');let base;
function g(){return frame.contentWindow}function check(value,msg){if(!value)throw Error(msg)}
function reset(){const w=g();base??=w.eval('JSON.stringify(state)');check(base&&base!=='null','先建立独立测试档');w.__rentersBase=base;w.eval(`state=JSON.parse(window.__rentersBase);state.cash=20000;state.housing='shared';state.housingCost=800;state.housingLease={key:'shared',monthly:800,depositHeld:800,startMonth:state.month,renewalMonth:state.month+12};state._computedExpenses=null;delete state.rentersInsurance;delete state.rentersIncidents;state._rentersExpenseAddon=0;syncFinance();clearModals();`);return w;}
const ev=s=>g().eval(s),btn=t=>[...g().document.querySelectorAll('.event-active button')].find(b=>b.textContent===t),primary=()=>g().document.querySelector('.event-active .insurance-document-action');
function policyPreview(){reset().openInsurance('renters')}
function receiptPreview(){const w=reset();w.eval('RentersRules.pay(state,"basic");RentersRules.assess(state,()=>0);');w.openRentersIncidents(false)}
async function measureLayout(){const rows=[];try{for(const width of [320,390,800])for(const page of ['policy','receipt']){frame.style.width=width+'px';if(page==='policy')policyPreview();else receiptPreview();await new Promise(requestAnimationFrame);const d=g().document,scene=d.querySelector('.insurance-document-scene'),sheet=d.querySelector('.insurance-document-sheet'),button=d.querySelector('.insurance-document-action');await Promise.all([...d.querySelectorAll('.event-active img')].map(i=>i.decode()));const b=button.getBoundingClientRect(),s=scene.getBoundingClientRect();check(d.documentElement.scrollWidth<=width,'横向溢出 '+width);check(b.height>=44&&b.left>=s.left&&b.right<=s.right,'确认按钮越界 '+width);rows.push({width,page,horizontalOverflow:false,buttonHeight:b.height,scrollable:sheet.scrollHeight>sheet.clientHeight,imagesLoaded:true});}document.getElementById('layout').textContent=JSON.stringify({passed:true,rows},null,2);}catch(e){document.getElementById('layout').textContent=JSON.stringify({passed:false,error:String(e),rows},null,2)}finally{frame.style.width='390px';policyPreview();}}
function startQA(){const w=g();if(!w.eval("state")){w.document.getElementById("careerPreview").click();w.document.getElementById("start").click();}return runRenters();}
async function runRenters(){const w=g(),results=[];let originalRandom=w.Math.random;function pass(s){results.push(s);out.textContent=JSON.stringify({running:true,results},null,2)}
 try{
 reset();w.openInsurance();check(!!w.document.querySelector('.renters-hub-entry .renters-entry-action'),'hub embedded entry');w.document.querySelector('.renters-entry-action').click();check(ev('state.cash')===20000,'view changed cash');check(!!w.document.querySelector('[data-document-kind="renters"]'),'policy not embedded');
 btn('选择基础租客险').click();check(ev('state.cash')===20000,'preview charged');let stale=primary().onclick;primary().click();check(ev('state.cash')===19980&&ev('RentersRules.covered(state)'),'basic activation');stale({preventDefault(){},stopPropagation(){}});check(ev('state.cash')===19980,'stale duplicate');pass('真实嵌画入口/预览不扣款/基础投保20/旧确认防重');
 reset();w.openInsurance('renters');btn('选择全赔租客险').click();const old=primary().onclick;w.clearModals();old({preventDefault(){},stopPropagation(){}});check(ev('state.cash')===20000&&!ev('state.rentersInsurance'),'closed confirmation');w.openInsurance('renters');btn('选择全赔租客险').click();const cross=primary().onclick;w.eval('state=JSON.parse(JSON.stringify(state))');cross({preventDefault(){},stopPropagation(){}});check(ev('state.cash')===20000,'cross-save confirmation');pass('关闭确认/切换存档后的旧按钮无交易');
 reset();w.eval('RentersRules.pay(state,"basic");');w.openInsurance('renters');btn('预约下月切换至全赔租客险').click();check(ev('state.cash')===19980&&ev('state.rentersInsurance.pending.plan')==='full','scheduled upgrade');btn('撤销下月预约').click();check(!ev('state.rentersInsurance.pending'),'revoke');btn('预约下月切换至全赔租客险').click();w.eval('state.month++;syncFinance()');check(ev('RentersRules.due(state)')===30&&!ev('RentersRules.covered(state)'),'unpaid month coverage');w.openInsurance('renters');primary().click();check(ev('state.cash')===19950&&ev('RentersRules.covered(state)'),'renewal');pass('预约/免费撤销/次月切换/未付无保障/续费30');
 reset();w.eval('RentersRules.pay(state,"basic");RentersRules.schedule(state,"full");state.housing="studio";syncFinance();');check(ev('RentersRules.covered(state)')&&ev('state.rentersInsurance.pending.plan')==='full','rental transfer');w.eval('state.housing="own";syncFinance()');check(!ev('RentersRules.covered(state)')&&!ev('state.rentersInsurance.pending'),'owned termination');w.eval('state.housing="shared";syncFinance()');check(!ev('RentersRules.covered(state)'),'automatic revival');w.openInsurance('renters');btn('选择全赔租客险').click();primary().click();check(ev('state.cash')===19950&&ev('RentersRules.paid(state)')===50,'same month re-enrol');check(ev('InsuranceRules.quote(state).due')===0,'retained old payment leaked');pass('租住转移/自有终止/不自动恢复/同月重投完整收费');
 reset();w.eval('state.insurance.health={active:true,monthly:220};RentersRules.pay(state,"basic");syncFinance()');check(ev('InsuranceRules.quote(state).due')===220,'rent payment offsets health');check(ev('payMonthly("premiums",InsuranceRules.quote(state).due)'),'combined pay');check(ev('state.cash')===19760&&ev('InsuranceRules.quote(state).due')===0,'combined receipt');w.eval('syncFinance();syncFinance();syncFinance()');check(ev('state.baseLiving')===JSON.parse(base).baseLiving,'sync changed original living');w.eval('state.month++;syncFinance()');check(ev('InsuranceRules.quote(state).due')===240,'shared nextmonth');check(ev('payMonthly("premiums",240)'),'shared renewal');check(ev('state.cash')===19520&&ev('RentersRules.covered(state)'),'shared activation');pass('原医疗220保费保留/共享付款无错抵扣/反复sync不改生活费/次月合付');
 reset();w.eval('RentersRules.pay(state,"basic");RentersRules.assess(state,()=>0);state.cash=1459;');w.openRentersIncidents(false);check(primary().disabled,'shortfall not blocked');check(ev('state.rentersIncidents[state.month].total')===1460,'per-accident caps');check(ev('state.cash')===1459,'partial debit');w.eval('state=JSON.parse(JSON.stringify(state));RentersRules.assess(state,()=>1);state.cash=1460;');w.openRentersIncidents(false);const pay=primary().onclick;primary().click();check(ev('state.cash')===0&&ev('state.rentersIncidents[state.month].paid'),'aggregate pay');pay({preventDefault(){},stopPropagation(){}});check(ev('state.cash')===0,'duplicate pay');pass('三事故基础档各自赔付/合计1460/缺1不部分扣/读档不重抽/重复按钮不扣');
 reset();w.eval('RentersRules.assess(state,()=>0);RentersRules.pay(state,"full");state.housing="own";syncFinance();');check(ev('state.rentersIncidents[state.month].total')===5300,'retroactive change');pass('投保/补费/搬家不能改变已锁定事故');
 reset();w.eval('RentersRules.pay(state,"full");RentersRules.assess(state,()=>0);state.cash=0;');const stats=ev('JSON.stringify([state.energy,state.health,state.happiness,state.stress,currentCareerTime().free,state.carOwned])');w.openRentersIncidents(false);check(!primary().disabled,'zero cash full policy blocked');primary().click();check(ev('state.cash')===0&&ev('JSON.stringify([state.energy,state.health,state.happiness,state.stress,currentCareerTime().free,state.carOwned])')===stats,'extra effects or cash');pass('0现金全赔/不额外发钱/不扣时间属性或已有物品');
 reset();w.eval('RentersRules.pay(state,"basic");RentersRules.assess(state,()=>0);state.cash=0;state.turn={month:state.month,index:9,startCash:state.cash};state.town.movement={id:999,to:state.town.position,month:state.month,resolved:false,payExpected:state.month+1};');const month=ev('state.month');w.settleMonth();check(ev('state.month')===month&&w.document.getElementById('eventTitle').textContent==='租住事故结算','month bypassed shortfall');w.eval('state.cash=20000');w.openRentersIncidents(true);primary().click();check(ev('state.month')===month,'payment advanced before continue');w.Math.random=()=>.99;primary().click();check(ev('state.month')===month+1,'real month did not advance');check(ev('state.financeLedger.filter(x=>x.kind==="rentersIncidentPayment").length')===1,'ledger duplicate');pass('实际月末拦截/筹款回来一次结清/继续推进1个月/账本单笔');
 reset();w.Math.random=()=>.99;w.eval('state.turn={month:state.month,index:9,startCash:state.cash};state.town.movement={id:999,to:state.town.position,month:state.month,resolved:false,payExpected:state.month+1}');const prior=ev('state.month');w.settleMonth();check(ev('state.month')===prior+1,'no-accident monthly blocked');pass('无事故走原月结路径');
 reset();w.eval('RentersRules.pay(state,"basic");RentersRules.assess(state,()=>0);state.cash=0;');w.openRentersIncidents(false);btn('前往银行筹款').click();check(w.document.getElementById('eventTitle').textContent==='银行贷款','bank route');btn('取消').click();check(ev('state.cash')===0&&!ev('state.rentersIncidents[state.month].paid'),'bank cancel mutated');btn('前往银行筹款').click();btn('确认贷款').click();check(ev('state.cash')===1460&&w.document.getElementById('eventTitle').textContent==='租住事故结算','bank confirmed return');primary().click();check(ev('state.cash')===0&&ev('state.loans.at(-1).principal')===1460,'existing loan or net payment');pass('真实银行取消不扣款/确认贷款1460/返回事故一次支付，原贷款合同保留');
 reset();w.eval('RentersRules.pay(state,"basic");RentersRules.schedule(state,"full");state.pendingHousingMove={key:"studio",name:"Studio",monthly:1400,deposit:1400,effectiveMonth:state.month+1,requestedMonth:state.month};state.month++;syncFinance();');check(w.confirmHousingHandover(),'real housing handover');check(ev('state.housing')==='studio'&&ev('state.rentersInsurance.policy.housing')==='studio'&&ev('RentersRules.due(state)')===30,'handover policy/state');pass('原住房交接交易接入租客险转移，档位预约如期生效');
 reset();w.eval('RentersRules.assess(state,()=>0);state=JSON.parse(JSON.stringify(state));');w.openGame();check(w.document.getElementById('eventTitle').textContent==='租住事故结算'&&ev('state.rentersIncidents[state.month].total')===5300,'restore pending receipt');pass('序列化恢复后自动回到未结清事故，原快照保留');
 policyPreview();await Promise.all([...w.document.querySelectorAll('.event-active img')].map(i=>i.decode()));check([...w.document.querySelectorAll('.event-active img')].every(i=>i.naturalWidth>0),'image load');
 out.textContent=JSON.stringify({passed:true,groups:results.length,results,limits:['8766独立测试站点/显式fixture','非真机/多年自然游玩/真实断网验收']},null,2);
 }catch(e){out.textContent=JSON.stringify({passed:false,error:String(e),results},null,2)}finally{w.Math.random=originalRandom;}
}
</script>
