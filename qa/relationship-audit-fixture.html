<!doctype html><meta charset="utf-8"><title>关系板块独立验收</title>
<style>body{margin:0;background:#eee5cf;font:14px sans-serif}aside{width:250px;padding:12px;box-sizing:border-box}button{display:block;padding:10px;margin:8px 0}iframe{position:absolute;left:250px;top:0;width:390px;height:850px;border:0}pre{white-space:pre-wrap;word-break:break-word}</style>
<aside><b>独立QA新档，非用户存档</b><button onclick="runChecks()">运行关系回归</button><button onclick="preview('contacts')">联系人画面</button><button onclick="preview('person')">互动选择画面</button><button onclick="preview('result')">结果画面</button><button onclick="preview('history')">读档回执画面</button><button onclick="preview('empty')">空联系人画面</button><button onclick="layoutChecks()">检查六种布局</button><pre id="results"></pre><pre id="layout"></pre></aside><iframe id="frame" src="../index.html"></iframe>
<script>
const frame=document.getElementById('frame'),out=document.getElementById('results'),w=()=>frame.contentWindow,ev=s=>w().eval(s);let base;
const check=(v,m)=>{if(!v)throw Error(m)},event=()=>({preventDefault(){},stopPropagation(){}}),options=()=>[...w().document.querySelectorAll('.social-option')],snap=()=>ev('JSON.stringify(state)');
function reset(){const g=w();g.eval('key=function(s){return "wealthLife_QA_relationship_20261029_"+s}');if(!g.eval('state')){g.document.getElementById('careerPreview').click();g.document.getElementById('start').click()}base??=ev('JSON.stringify(state)');g.__relationshipBase=base;g.eval('clearModals();state=JSON.parse(window.__relationshipBase);state.cash=10000;pending=false;townHome();');return g}
function contacts(){w().document.getElementById('networkBtn').click()}
function person(i=0){contacts();w().document.querySelectorAll('.social-contact')[i].click()}
function preview(which){reset();if(which==='empty')ev('state.people=[]');contacts();if(['person','result','history'].includes(which))person();if(['result','history'].includes(which)){options()[0].click();if(which==='history'){ev('state=JSON.parse(JSON.stringify(state))');person()}}}
async function runChecks(){const g=w(),originalRandom=g.Math.random,results=[],pass=s=>{results.push(s);out.textContent=JSON.stringify({running:true,results},null,2)};try{
 reset();contacts();let before=snap();person();check(snap()===before,'opening mutated state');check(options().length===3,'missing options');pass('打开联系人与预览不消费，三种互动存在');
 for(const [index,cost,hours]of [[0,45,2],[1,0,1],[2,0,1]]){reset();g.Math.random=()=>.01;person();const free=ev('currentCareerTime().free'),old=options()[index].onclick;options()[index].click();check(ev('state.cash')===10000-cost,'wrong cost');check(ev('currentCareerTime().free')===free-hours,'wrong hours');check(ev('socialRecord().hours')===hours&&ev('!!socialRecord().kind'),'receipt not complete');before=snap();old(event());check(snap()===before,'duplicate changed state');ev('state=JSON.parse(JSON.stringify(state))');person();check(options().every(b=>b.disabled),'reload unlocks');check(snap()===before,'reload rerolls');}pass('吃饭45/2h、聊天0/1h、散步0/1h；重复与读档不重扣重抽');
 reset();person();let old=options()[0].onclick;g.clearModals();before=snap();old(event());check(snap()===before,'closed callback charged');person();old=options()[0].onclick;ev('state=JSON.parse(JSON.stringify(state))');before=snap();old(event());check(snap()===before,'cross save callback charged');person();old=options()[0].onclick;ev('state.month++');before=snap();old(event());check(snap()===before,'cross month callback charged');pass('关闭、换档、跨月旧确认失效');
 reset();ev('state.people=[{id:"a",name:"同名",relation:50,job:"同学"},{id:"b",name:"同名",relation:50,job:"邻居"}]');const free=ev('currentCareerTime().free');person(0);options()[0].click();person(1);check(!options()[0].disabled,'same name shares quota');options()[0].click();check(ev('state.cash')===9910&&ev('currentCareerTime().free')===free-4,'not accumulated');ev('state.month++');person(0);check(!options()[0].disabled,'new month blocked');pass('同名不同ID独立月限，费用时间累加，次月恢复');
 reset();person();old=options()[0].onclick;ev('state.cash=44');before=snap();old(event());check(snap()===before,'insufficient cash partial mutation');person();ev('state.cash=0');options()[1].click();check(ev('state.cash')===0&&ev('socialRecord().cost')===0,'free chat failed');pass('预览后缺款不扣费，零现金可免费聊天');
 reset();person();old=options()[0].onclick;ev('state.health=29');before=snap();old(event());check(ev('state.cash')===10000&&!ev('socialRecord()'),'low health executed');pass('预览后低健康阻止互动，转医疗流程');
 reset();person();old=options()[0].onclick;ev('state.lifeActivityTime={month:state.month,hours:999}');before=snap();old(event());check(snap()===before&&!ev('socialRecord()'),'time shortage executed');pass('预览后自由时间耗尽不执行、不扣款');
 reset();person();old=options()[1].onclick;ev('beginTreatment(state,{id:"qa-recovery",quote:treatmentQuote({kind:"ordinary",coverage:1}),startMonth:state.month});payTreatment(state,"qa-recovery");state.health=80');before=snap();old(event());check(ev('state.cash')===10000&&!ev('socialRecord()')&&ev('isRecoveryMonth(state)'),'paid recovery executed');pass('健康恢复至80但疗程尚在本月，仍禁止普通互动');
 reset();g.Math.random=()=>.999;ev('state.people[0].relation=100;state.energy=1;state.social=99;state.happiness=1');person();options()[2].click();check(ev('socialRecord().success')===false,'failure fixture');check(ev('socialRecord().appliedGain')===0,'capped gain');check(ev('socialRecord().effects.energy')===-1&&ev('socialRecord().effects.social')===1&&ev('socialRecord().effects.happiness')===-1,'actual deltas');pass('失败结果、能量/社交/幸福边界与满亲密度显示真实变化');
 reset();ev('state.socialMonth={month:state.month,person:state.people[0].id,cost:15,scene:"旧交流",success:true,gain:7}');const legacyFree=ev('currentCareerTime().free');person();check(options().every(b=>b.disabled),'legacy quota');check(ev('currentCareerTime().free')===legacyFree&&!ev('Number.isFinite(socialRecord().hours)'),'legacy retrocharge');pass('旧回执保留原价与无耗时历史，不追扣或伪造');
 reset();ev('state.people=[]');contacts();check(g.document.querySelectorAll('.social-contact').length===0,'empty list');check(g.document.querySelector('.social-paper').textContent.includes('暂时还没有联系人'),'empty guidance');pass('空联系人状态有引导，可返回');
 preview('result');out.textContent=JSON.stringify({passed:true,groups:results.length,results,limits:['独立QA槽位','未验证真机Safari、多年连续游玩和完整断网']},null,2);
 }catch(e){out.textContent=JSON.stringify({passed:false,error:String(e),results},null,2)}finally{g.Math.random=originalRandom}}
async function sceneLoads(){const g=w(),urls=[...new Set([...g.document.querySelectorAll('.event-active .social-scene')].map(n=>g.getComputedStyle(n).backgroundImage).filter(x=>x!=='none').map(x=>x.slice(5,-2)))];check(urls.length>0,'missing scene background');for(const url of urls){const img=new g.Image();img.src=url;await img.decode();check(img.naturalWidth>0&&img.naturalHeight>0,'scene image empty')}return urls.length}
async function layoutChecks(){const rows=[];try{for(const width of [320,390,800])for(const longName of [false,true])for(const view of ['contacts','person']){frame.style.width=width+'px';reset();if(longName)ev('state.people[0].name="A_very_long_contact_name_".repeat(6);state.people[0].job="长期认识的同学兼共同创作伙伴".repeat(5)');contacts();if(view==='person')person();await new Promise(requestAnimationFrame);const d=w().document;for(const img of d.querySelectorAll('.event-active img'))await img.decode();const sceneImages=await sceneLoads(),event=d.querySelector('.event-active');check(event.scrollWidth<=event.clientWidth,'event overflow '+width+' long='+longName);check(d.documentElement.scrollWidth<=width,'page overflow '+width+' long='+longName);rows.push({width,view,longName,sceneImages,noHorizontalOverflow:true,controls:d.querySelectorAll('.event-active button').length})}document.getElementById('layout').textContent=JSON.stringify({passed:true,rows},null,2)}catch(e){document.getElementById('layout').textContent=JSON.stringify({passed:false,error:String(e),rows},null,2)}finally{frame.style.width='390px';preview('contacts')}}
</script>
