<!doctype html><meta charset="utf-8"><title>人寿险与人生结局隔离验收</title>
<style>body{margin:0;font:13px sans-serif;background:#eee5cf}aside{width:235px;padding:10px;box-sizing:border-box}button{display:block;margin:6px 0;padding:8px}iframe{position:absolute;left:235px;top:0;width:800px;height:100vh;border:0}pre{white-space:pre-wrap;font-size:11px}</style>
<aside><b>独立QA测试档，非用户存档</b><button onclick="startQA()">建立独立测试档并执行寿险回归</button><button onclick="policyPreview()">查看人寿保单</button><button onclick="endingPreview()">查看人生结局</button><button onclick="measureLayout()">检查三种宽度与两种画面</button><button onclick="policyPreview();present()">仅显示人寿保单</button><button onclick="endingPreview();present()">仅显示人生结局</button><pre id="layout"></pre><pre id="results"></pre></aside><iframe id="frame" src="../index.html"></iframe>
<script>
const frame=document.getElementById('frame'),out=document.getElementById('results');let base;const w=()=>frame.contentWindow,ev=s=>w().eval(s);
function check(ok,msg){if(!ok)throw Error(msg)}function reset(){const g=w();if(!g.eval('state')){g.document.getElementById('careerPreview').click();g.document.getElementById('start').click();}base??=g.eval('JSON.stringify(state)');check(base&&base!=='null','先建立测试档');g.__lifeBase=base;g.eval('state=JSON.parse(window.__lifeBase);state.cash=20000;state.housing="family";state.housingCost=450;state._computedExpenses=null;syncFinance();clearModals();');return g;}
const primary=()=>w().document.querySelector('.event-active .insurance-document-action'),button=t=>[...w().document.querySelectorAll('.event-active button')].find(b=>b.textContent===t),event=()=>({preventDefault(){},stopPropagation(){}});
function review(g){g.eval('state.turn={month:state.month,index:9,startCash:state.cash};state.town.movement={id:999,to:state.town.position,month:state.month,resolved:false,payExpected:state.month+1};clearModals();');}
function policyPreview(){reset().openInsurance('life')}
function endingPreview(){const g=reset();g.Math.random=()=>.99;g.eval('state.age=89;state.month=839;state.insurance.life={active:true,monthly:35};syncFinance();LifeInsuranceRules.pay(state);');review(g);g.settleMonth();}
function present(){document.querySelector('aside').hidden=true;frame.style.left='0';frame.style.width='100vw';}
async function measureLayout(){const rows=[];try{for(const width of [320,390,800])for(const page of ['policy','ending']){frame.style.width=width+'px';page==='policy'?policyPreview():endingPreview();await new Promise(requestAnimationFrame);const d=w().document,scene=d.querySelector('.insurance-document-scene'),sheet=d.querySelector('.insurance-document-sheet'),b=d.querySelector('.insurance-document-action');await Promise.all([...d.querySelectorAll('.event-active img')].map(i=>i.decode()));const r=b.getBoundingClientRect(),s=scene.getBoundingClientRect();check(d.documentElement.scrollWidth<=width,'横向溢出');check(r.height>=44&&r.left>=s.left&&r.right<=s.right,'按钮越界');rows.push({width,page,buttonHeight:r.height,horizontalOverflow:false,scrollable:sheet.scrollHeight>sheet.clientHeight,imagesLoaded:true});}document.getElementById('layout').textContent=JSON.stringify({passed:true,rows},null,2);}catch(e){document.getElementById('layout').textContent=JSON.stringify({passed:false,error:String(e),rows},null,2)}finally{frame.style.width='390px';policyPreview();}}
function startQA(){const g=w();if(!g.eval('state')){g.document.getElementById('careerPreview').click();g.document.getElementById('start').click();}return runChecks();}
async function runChecks(){const results=[],g=w(),random=g.Math.random;const pass=name=>{results.push(name);out.textContent=JSON.stringify({running:true,results},null,2)};try{
 reset();g.openInsurance();check(!!g.document.querySelector('.life-hub-entry .life-entry-action'),'hub entry');g.document.querySelector('.life-entry-action').click();check(ev('state.cash')===20000&&!ev('state.insurance.life'),'view bought policy');check(!!g.document.querySelector('[data-document-kind="life"]'),'no embedded policy');primary().click();check(ev('state.cash')===20000,'preview charged');const stale=primary().onclick;primary().click();check(ev('state.cash')===19965&&ev('LifeInsuranceRules.covered(state)'),'35 activation');stale(event());check(ev('state.cash')===19965,'duplicate enrolment');pass('嵌画入口/预览不扣款/35投保/重复确认防重');
 reset();g.openInsurance('life');primary().click();const closed=primary().onclick;g.clearModals();closed(event());check(ev('state.cash')===20000,'closed stale');g.openInsurance('life');primary().click();const cross=primary().onclick;g.eval('state=JSON.parse(JSON.stringify(state))');cross(event());check(ev('state.cash')===20000,'cross owner');pass('关闭及切换存档后旧投保确认不扣款');
 reset();g.eval('state.age=66');g.openInsurance('life');check(primary().disabled,'66 new enrolment allowed');g.eval('state.insurance.life={active:true,monthly:27,deathBenefit:76543};syncFinance()');g.openInsurance('life');primary().click();check(ev('state.cash')===19973&&ev('LifeInsuranceRules.benefit(state.insurance.life)')===76543,'old term changed');pass('66岁不能新投保/旧保单可续/旧27保费及76543保额保留');
 reset();g.eval('state.insurance={health:{active:true,monthly:200},life:{active:true,monthly:35}};state.monthlyPayments={month:state.month,premiums:220,housing:0,living:0};syncFinance()');check(ev('LifeInsuranceRules.due(state)')===15&&!ev('LifeInsuranceRules.covered(state)'),'partial old receipt');g.openInsurance('life');primary().click();check(ev('state.cash')===19985&&ev('InsuranceRules.quote(state).due')===0,'legacy partial charged twice');pass('旧总保费部分付款核对，缺15只收15，不凭active视为已付');
 reset();g.eval('state.insurance={health:{active:true,monthly:220}};state.housing="shared";LifeInsuranceRules.pay(state);RentersRules.pay(state,"basic");syncFinance()');check(ev('InsuranceRules.quote(state).due')===220,'cross insurance credit');g.eval('payMonthly("premiums",220);state.month++;syncFinance()');check(ev('InsuranceRules.quote(state).due')===275,'nextmonth shared due');check(ev('payMonthly("premiums",275)'),'shared payment failure');check(ev('LifeInsuranceRules.covered(state)&&RentersRules.covered(state)'),'shared paid not reflected');check(ev('state.insurance.health.monthly')===220,'health fee changed');pass('人寿35/租客20/旧医疗220共享账本，次月275一次付款正确');
 reset();g.eval('LifeInsuranceRules.pay(state)');g.openInsurance('life');primary().click();check(ev('!!state.pendingInsuranceChanges.life'),'cancel schedule');button('撤销下月停保预约').click();check(!ev('state.pendingInsuranceChanges.life'),'revoke');primary().click();g.eval('state.month++;syncFinance();state.age=66');g.openInsurance('life');check(!ev('state.insurance.life.active')&&primary().disabled,'cancel or age on rebuy');pass('停保次月生效/免费撤销/已付不退/重投仍受年龄限制');
 reset();g.openInsurance('life');const people=ev('JSON.stringify(state.people)');const select=g.document.querySelector('select[aria-label="选择人寿险受益人"]');select.value=select.options[1].value;button('确认免费更改受益人').click();check(ev('state.lifeInsurance.beneficiary.type')==='person'&&ev('state.cash')===20000&&ev('JSON.stringify(state.people)')===people,'beneficiary mutation');pass('免费选择已有联系人，原财富/关系不变');
 reset();g.Math.random=()=>.99;g.eval('state.age=89;state.month=11;state.insurance.life={active:true,monthly:27,benefit:123456};syncFinance();LifeInsuranceRules.pay(state);LifeInsuranceRules.cancel(state);');review(g);g.settleMonth();check(ev('state.month')===12&&ev('state.age')===90&&ev('state.history.at(-1).month')===12,'ledger not first');check(ev('state.lifeEnding.amount')===123456&&!ev('state.insurance.life.active'),'next month cancel erased claim');check(ev('state.lifeEnding.cashAfterSettlement')===ev('state.cash'),'claim added to player cash');pass('89岁最后月先完整结账/90岁结局/次月停保不抹去本月123456保障');
 const ending=ev('JSON.stringify(state.lifeEnding)'),cash=ev('state.cash'),month=ev('state.month');g.settleMonth();g.settleMonthUnsafe();g.rollTown();g.finish();check(ev('state.month')===month&&ev('state.cash')===cash&&ev('JSON.stringify(state.lifeEnding)')===ending,'ending repeat mutation');check(!ev('spendConfirmed("test",1)'),'terminal spend');g.eval('state=JSON.parse(JSON.stringify(state))');g.openGame();check(ev('JSON.stringify(state.lifeEnding)')===ending&&ev('state.cash')===cash,'reload payout twice');pass('结局重复点击/直接月结/出门/读档均不推进或重复赔付，存档可查看');
 reset();g.Math.random=()=>.99;g.eval('state.age=95;state.insurance.life={active:true,monthly:22};syncFinance()');g.openGame();check(!ev('state.lifeEnding')&&ev('state.month')===0,'old age ended on load');review(g);g.settleMonth();check(ev('state.lifeEnding.amount')===100000&&ev('state.month')===1,'old age manual month');check(ev('state.financeLedger.filter(x=>x.kind==="lifePremiumMonthEnd").length')===1,'month-end fee missing');pass('95岁旧档读取不自动结束/主动月结后结局/缺失保额补100000/原22收费一次');
 reset();g.Math.random=()=>.99;g.eval('state.age=89;state.month=11');review(g);g.settleMonth();check(ev('state.lifeEnding.amount')===0&&!ev('state.insurance.life'),'uninsured invented policy');pass('无寿险也正常90岁结局，赔付0、不自动投保或新增遗产机制');
 reset();g.eval('state.age=93;state.annualRun={paused:false};');g.openGame();check(!ev('state.lifeEnding')&&ev('state.annualRun.paused'),'old annual auto advance');review(g);g.eval('annualBusy=true');g.settleMonth();check(ev('state.month')===0&&!ev('state.lifeEnding')&&g.document.getElementById('eventTitle').textContent==='确认已满90岁的人生月结','old annual direct end');const oldConfirm=button('确认本月账务并进入结局').onclick;g.clearModals();oldConfirm(event());check(ev('state.month')===0&&!ev('state.lifeEnding'),'closed old-age confirmation');g.settleMonth();g.eval('annualBusy=false');button('确认本月账务并进入结局').click();check(ev('!!state.lifeEnding'),'old explicit confirmation');pass('旧90岁以上年度自动推进暂停，须主动确认结账');
 reset();g.eval('state.cash=0');g.openInsurance('life');primary().click();check(primary().disabled,'low cash purchase');button('前往银行筹款').click();button('取消').click();check(ev('state.cash')===0&&!ev('state.insurance.life'),'bank cancel bought policy');button('前往银行筹款').click();button('确认贷款').click();primary().click();check(ev('state.cash')===0&&ev('LifeInsuranceRules.covered(state)')&&ev('state.loans.at(-1).principal')===35,'bank real purchase');pass('不足35不自动借款，原银行取消/确认35后返回投保');
 policyPreview();await Promise.all([...g.document.querySelectorAll('.event-active img')].map(i=>i.decode()));out.textContent=JSON.stringify({passed:true,groups:results.length,results,limits:['独立本机QA新档及明确fixture','非真机/多年自然游玩/完整断网验收']},null,2);
 }catch(e){out.textContent=JSON.stringify({passed:false,error:String(e),results},null,2)}finally{g.Math.random=random;g.eval('annualBusy=false');}}
</script>
