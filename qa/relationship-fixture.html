<!doctype html><meta charset="utf-8"><title>关系独立QA</title><style>body{margin:0;background:#eee5cf;font:13px sans-serif}aside{padding:12px;width:220px;box-sizing:border-box}button{display:block;margin:10px 0;padding:9px}iframe{position:absolute;left:220px;top:0;width:390px;height:844px;border:0}pre{white-space:pre-wrap}</style><aside><b>独立QA样例，非用户存档</b><button onclick="run()">运行关系回归</button><button onclick="layouts()">检查关系布局</button><button onclick="initial();present()">第一月通讯录预览</button><button onclick="visit();present()">五人做客预览</button><pre id="result"></pre><pre id="layout"></pre></aside><iframe id="frame" src="../index.html"></iframe><script>
const f=document.getElementById('frame'),w=()=>f.contentWindow,ev=s=>w().eval(s);let base;const assert=(v,m)=>{if(!v)throw Error(m)},btn=t=>[...w().document.querySelectorAll('.event-active button')].find(b=>b.textContent===t),hit=t=>{const b=btn(t);assert(b&&!b.disabled,'button unavailable '+t);b.click()};
function reset(){if(!ev('state')){w().document.getElementById('careerPreview').click();w().document.getElementById('start').click()}base??=ev('JSON.stringify(state)');w().__relationshipBase=base;ev('state=JSON.parse(window.__relationshipBase);clearModals();pending=false;state.town.screen="home";roomReview=null;');}
function initial(){reset();ev('state.people=[{id:"old-school",name:"旧同学",relation:60,status:"同学"}];delete state.relationshipV1.openingContactsReset;openGame();clearModals();roomOpenArrangement("social")');}
function visit(){reset();ev('state.housing="family";state.cash=1000;state.energy=50;state.happiness=90;state.people=Array.from({length:5},(_,i)=>({id:"guest"+i,name:"QA朋友"+i,relation:60,age:30,gender:i%2?"male":"female"}));RelationshipUI.openVisit("guest0",new Set(state.people.map(p=>p.id)))');}
function present(){document.querySelector('aside').hidden=true;f.style.left='0';}
function run(){const rows=[];try{
 initial();assert(ev('state.people.length')===1&&ev('state.people[0].relation')===10&&ev('state.people[0].status')==='经理','first month reset');const id=ev('state.people[0].id');ev('state.people.push({id:"earned",name:"后认识的同事",relation:10});openGame()');assert(ev('state.people.length')===2&&ev('state.people[0].id')===id,'load deleted earned person');rows.push('第一月仅经理10/一次迁移/后来认识的人不删');
 reset();ev('roomOpenArrangement("social")');w().document.querySelector('.social-contact').click();assert(btn('一起吃饭 · 45 · 2h').disabled,'meal at10');const free=ev('currentCareerTime().free'),social=ev('state.social'),cash=ev('state.cash'),owner=ev('state.people[0].id');const old=w().document.querySelector('.social-option-list button:nth-child(2)');old.click();assert(ev('currentCareerTime().free')===free-1&&ev('state.social')===social,'first chat');const after=ev('JSON.stringify(state)');old.click();assert(ev('JSON.stringify(state)')===after,'old callback');hit('返回联系人');w().document.querySelector('.social-contact').click();hit('聊天 · 免费 · 1h');assert(ev('currentCareerTime().free')===free-2&&ev('state.cash')===cash,'repeat chat');rows.push('亲密10吃饭禁用/同月重复聊天/时间累计/旧按钮不重扣/无社交奖励');
 visit();let oldConfirm=w().document.querySelector('.relationship-controls button');const prior=ev('currentCareerTime().free');oldConfirm.click();assert(ev('state.cash')===850&&ev('state.energy')===40&&ev('currentCareerTime().free')===prior-3,'visit accounting');const visitAfter=ev('JSON.stringify(state)');oldConfirm.click();assert(ev('JSON.stringify(state)')===visitAfter,'visit duplicate');rows.push('5人做客150/10能量/3h整场一次/单笔防重');
 visit();ev('state.energy=9');const before=ev('JSON.stringify(state)');w().document.querySelector('.relationship-controls button').click();assert(ev('JSON.stringify(state)')===before,'insufficient energy mutated');rows.push('执行前能量复核/缺资源不扣');
 reset();const original=ev('state.people[0].id');ev('RelationshipWork.register(state.currentWorkUnitId)');assert(ev('state.people.length')===1&&ev('state.people[0].id')===original,'same unit manager duplicated');ev('RelationshipWork.register()');assert(ev('state.people.length')===2,'new unit no manager');rows.push('同单位沿用经理/新单位新增经理');
 for(let i=0;i<5;i++){ev('window.qaCandidate=RelationshipWork.coworkerCandidate();state.people.push({...window.qaCandidate.p})')}assert(ev('RelationshipWork.coworkerCandidate()')===null,'more than5');rows.push('同事候选稳定/认识5人截止');
 for(const [kind,cardId]of [['life','friend-life'],['interest','friend-hobby'],['classmate','classmate-help']]){reset();ev('state.people[0].relation=90;state.people[0].interests=["绘画"];state.hobbies={绘画:1};state.hobbyXP={绘画:0};state.study={id:"qa-degree",total:12,progress:9};state.people[0].studyProjectId="qa-degree";state.town.movement={id:700,to:3,month:state.month,resolved:false};state.town.screen="map"');w().__qaKind=kind;w().__qaCard=cardId;ev('window.qaHelpRecord={id:"map-qa-help",month:state.month,status:"pending",category:"community",cardId:window.__qaCard,personId:state.people[0].id,skill:"绘画"};MapCards.data(state).events[state.month+":700"]=window.qaHelpRecord;showMapRecord(window.qaHelpRecord)');if(kind==='interest'){assert(!btn('接受帮助'),'obsolete XP help still executable');rows.push('技能帮助待工作报价确认，不执行旧+10XP');continue;}hit('接受帮助');assert(ev('window.qaHelpRecord.status')==='resolved','help not resolved '+kind);assert(ev('state.people[0].relation')===90,'help added intimacy');assert(ev('RelationshipRules.helpEligible(state,state.people[0],window.__qaKind,"绘画")')===(kind==='life'),'repeat help qualification');}rows.push('生活/同学帮助真实卡面接受/无额外亲密度/同人帮助不限次数/同笔防重');
 document.getElementById('result').textContent=JSON.stringify({passed:true,rows,limits:['合成QA存档','地图概率未改','非真机/多年/完整断网']},null,2);
 }catch(e){document.getElementById('result').textContent=JSON.stringify({passed:false,error:String(e),rows},null,2)}}
async function layouts(){const rows=[];try{for(const width of [320,390,800])for(const page of ['contacts','visit']){f.style.width=width+'px';if(page==='contacts')initial();else visit();await new Promise(requestAnimationFrame);const d=w().document,stage=d.querySelector('.social-address-desk,.relationship-stage');assert(d.documentElement.scrollWidth<=width,'horizontal overflow');for(const b of stage.querySelectorAll('button')){assert(b.getBoundingClientRect().height>=44,'button under44')}rows.push({width,page,overflow:false,minTarget44:true})}document.getElementById('layout').textContent=JSON.stringify({passed:true,rows},null,2)}catch(e){document.getElementById('layout').textContent=JSON.stringify({passed:false,error:String(e),rows},null,2)}finally{f.style.width='390px';initial()}}
</script>
