<!doctype html><html lang="zh"><meta charset="utf-8"><title>关系更新隔离验收</title><style>body{margin:0;background:#eee6d3;color:#23412b;font-family:system-ui}header{padding:8px}button,select{font:inherit;margin:4px;padding:8px}iframe{display:block;width:390px;height:844px;border:0;margin:auto}#report{white-space:pre-wrap;font-size:13px}</style><header><strong>仅本机隔离验收 · 测试存档947</strong><br><select id="cards"></select><select id="width"><option>390</option><option>320</option><option>430</option><option>1280</option></select><button id="open">查看卡片</button><button id="care">护理券页面</button><button id="tests">运行事务验收</button><div id="report"></div></header><iframe src="/index.html" id="game"></iframe><script>
const frame=document.getElementById('game'),sel=document.getElementById('cards'),report=document.getElementById('report');let w,base;
frame.onload=()=>{w=frame.contentWindow;w.document.getElementById('enterGame')?.click();w.eval("slot=947;document.getElementById('job').value='barista';document.getElementById('start').click();clearModals();openRoom();window.qaBase=JSON.parse(JSON.stringify(state));");base=w.qaBase;for(const c of Object.values(w.RelationshipLifeCards.cards)){const o=document.createElement('option');o.value=c.id;o.textContent=c.title;sel.append(o);}report.textContent='游戏已加载，'+sel.options.length+'张主卡可验证。';};
function fixture(){w.eval(`PetPages.close();RelationshipLifePages.close();clearModals();state=JSON.parse(JSON.stringify(window.qaBase));Object.assign(state,{month:2,cash:50000,energy:80,happiness:50,stress:20,health:80,housing:'studio',housingLease:{key:'studio',startMonth:0},roomLocation:'town',townMode:true,homeArrival:{month:2,status:'completed'},turn:{month:2,index:0,startCash:50000},study:{id:'qa-study',target:'associate',total:48,progress:2},pets:[{id:'qa-dog',type:'柯基',species:'dog',name:'豆豆',adoptMonth:0,health:70}],petCareCoupons:3,town:{position:3,rolls:1,movement:{id:1,month:2,to:3,resolved:false},history:[]}});save();`);}
function draw(id){fixture();w.eval(`{const c=RelationshipLifeCards.cards[${JSON.stringify(id)}];state.people=[{id:'qa-contact',name:'隔离测试联系人',status:c.role,relationshipRole:({经理:'manager',同事:'coworker',同学:'classmate',房东:'landlord',宠友:'petfriend'})[c.role],relation:80,gender:'female'}];state.relationshipHome.managers={coffee:'qa-contact'};state.relationshipHome.currentManagerId='qa-contact';state.relationshipHome.landlordId='qa-contact';save();if(!RelationshipLifeCards.saveCard(state,c.id,'qa-contact',1,{save,hasAirConditioner:true,random:()=>.3}))throw Error('saveCard failed '+c.id);RelationshipLifePages.open();}`);}
document.getElementById('width').onchange=()=>frame.style.width=document.getElementById('width').value+'px';
document.getElementById('open').onclick=()=>draw(sel.value);document.getElementById('care').onclick=()=>{fixture();w.eval("state.roomLocation='home';PetPages.openClean(0)");};
document.getElementById('tests').onclick=async()=>{let passed=[];const assert=(v,msg)=>{if(!v)throw Error(msg)};try{
 for(const c of Object.values(w.RelationshipLifeCards.cards)){draw(c.id);await Promise.all([...w.document.querySelectorAll('.relationship-life-canvas img')].map(i=>i.decode()));assert(w.document.querySelectorAll('.relationship-life-hit').length===c.options.length,c.id+' buttons');const box=w.document.querySelector('.relationship-life-overlay');assert(box.scrollWidth<=w.innerWidth,c.id+' overflow');}passed.push('25张主卡图片解码、按钮数量、390px无横溢出');
 draw('manager-extra-shifts');const result=w.eval(`(()=>{let r=state.town.movement.relationshipLifeCard,old=Storage.prototype.setItem,before=JSON.stringify(state);Storage.prototype.setItem=function(k,v){if(k===key(slot))throw Error('isolated quota');return old.call(this,k,v)};let failed;try{failed=RelationshipLifeCards.confirm(state,r.id,0,{free:100,save});}finally{Storage.prototype.setItem=old}if(failed.ok||JSON.stringify(state)!==before)throw Error('save rollback');r=state.town.movement.relationshipLifeCard;const cash=state.cash,q=r.quotes[0];const ok=RelationshipLifeCards.confirm(state,r.id,0,{free:100,save});if(!ok.ok||Math.abs(state.cash-cash-q.cash)>.001)throw Error('immediate income');if(RelationshipLifeCards.confirm(state,r.id,0,{free:100,save}).ok)throw Error('duplicate');return true})()`);assert(result,'income');passed.push('真实localStorage失败回滚、重试即时到账、重复点击不重复领工资');
 fixture();const care=w.eval(`(()=>{ensurePetCare();const t=petCareTasks().find(t=>t.kind==='Clean'),sel={[t.key]:'coupon'},before=JSON.stringify(state),old=Storage.prototype.setItem;Storage.prototype.setItem=function(k,v){if(k===key(slot))throw Error('isolated quota');return old.call(this,k,v)};let failed;try{failed=payPetCare(sel);}finally{Storage.prototype.setItem=old}if(failed||JSON.stringify(state)!==before)throw Error('coupon rollback');const cash=state.cash;if(!payPetCare(sel)||state.petCareCoupons!==2||state.cash!==cash||state.pets[0].health!==90)throw Error('coupon pay');if(payPetCare(sel)||state.petCareCoupons!==2)throw Error('coupon duplicate');return true})()`);assert(care,'care');passed.push('护理券真实保存失败回滚、扣一次券、健康+20、费用0、护理日期防重复');
 for(const key of Object.keys(w.RelationshipCardData.followups)){const i=new w.Image();i.src='/'+w.RelationshipCardData.followups[key].art;await i.decode();}passed.push('4张独立后续图解码');
 fixture();w.eval("state.roomLocation='home';PetPages.openClean(0)");passed.push('护理页3种方式与动态剩余次数显示');report.textContent='PASS '+passed.length+'组\n'+passed.join('\n');window.qaReport={passed,pageErrors:[]};
 }catch(e){report.textContent='FAIL '+e.stack;window.qaReport={passed,error:e.message};}}
</script></html>
