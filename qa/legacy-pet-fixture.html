<!doctype html><meta charset="utf-8"><title>旧宠物兼容隔离验收</title><style>body{margin:0;background:#eee5cf;font:13px sans-serif}aside{width:235px;padding:10px;box-sizing:border-box}button{display:block;padding:8px;margin:6px 0}iframe{position:absolute;left:235px;top:0;width:800px;height:100vh;border:0}pre{white-space:pre-wrap}</style><aside><b>独立QA新档和合成旧宠物，非用户存档</b><button onclick="runChecks()">执行旧宠物兼容回归</button><button onclick="layoutChecks()">检查三宽度布局</button><button onclick="preview();present()">仅显示旧宠物管理</button><button onclick="combinedPreview();present()">仅显示旧合并保单</button><pre id="results"></pre><pre id="layout"></pre></aside><iframe id="frame" src="../index.html"></iframe><script>
const frame=document.getElementById('frame'),out=document.getElementById('results'),w=()=>frame.contentWindow,ev=s=>w().eval(s);let base;
const check=(ok,msg)=>{if(!ok)throw Error(msg)},button=t=>[...w().document.querySelectorAll('.event-active button')].find(b=>b.textContent===t),primary=()=>w().document.querySelector('.event-active .insurance-document-action'),event=()=>({preventDefault(){},stopPropagation(){}});
function reset(){const g=w();if(!g.eval('state')){g.document.getElementById('careerPreview').click();g.document.getElementById('start').click();}base??=g.eval('JSON.stringify(state)');g.__petLegacyBase=base;g.eval('state=JSON.parse(window.__petLegacyBase);state.cash=20000;state.housing="family";state.housingCost=450;state.pets=[];state.insurance={};state._computedExpenses=null;pending=false;syncFinance();clearModals();');return g;}
function preview(){const g=reset();g.eval('state.pets=[{type:"蜥蜴",name:"小绿"},{type:"乌龟",name:"慢慢"}];syncFinance()');g.openPetHub();}
function combinedPreview(){const g=reset();g.eval('state.pets=[{type:"狗",name:"阿豆"}];state.insurance.pet={name:"旧合并宠物保险",active:true,monthly:47,coverage:.65};syncFinance()');g.openLegacyPetPolicy();}
function present(){document.querySelector('aside').hidden=true;frame.style.left='0';frame.style.width='100vw';}
async function runChecks(){const results=[],g=w(),random=g.Math.random,pass=x=>{results.push(x);out.textContent=JSON.stringify({running:true,results},null,2)};try{
 reset();g.eval('state.month=7;state.pets=[{type:"蜥蜴",name:"小绿"},{type:"乌龟",name:"慢慢"},{id:"old-dog",careId:"old-care",type:"狗",name:"阿豆",adoptMonth:0,care:{nextAnnual:3,nextClean:5,history:[{month:2,kind:"Clean",cost:10,hours:2}]}}];syncFinance()');check(ev('state.pets[0].species')==='gecko'&&ev('state.pets[1].species')==='tortoise','aliases');check(ev('state.pets[0].adoptMonth')===undefined&&ev('state.pets[0].care.nextAnnual')===19,'dates invented');check(ev('state.pets[2].id')==='old-dog'&&ev('state.pets[2].care.nextClean')===5&&ev('state.pets[2].care.history.length')===1,'old fields changed');const before=ev('JSON.stringify(state.pets)'),total=ev('petMonthly()');g.eval('state=JSON.parse(JSON.stringify(state));syncFinance();syncFinance()');check(ev('JSON.stringify(state.pets)')===before&&ev('petMonthly()')===total&&ev('state.cash')===20000,'not idempotent');pass('蜥蜴/乌龟映射、唯一编号/读档稳定、未知领养日期及原逾期历史保留、不收费');
 g.openPetHub();check(g.document.querySelectorAll('.pet-owned-card').length===3,'old cards absent');const policy=g.document.querySelector('button[aria-label="小绿 · 保险"]');check(!policy.disabled,'legacy policy disabled');policy.click();check(!!g.document.querySelector('[data-document-kind="pets"]'),'legacy policy no art');pass('旧宠物接入原嵌画管理及逐宠保险页面');
 reset();g.eval('state.month=7;state.pets=[{type:"狗",name:"阿豆",care:{nextClean:7,nextAnnual:19,history:[]}},{type:"未知伙伴",name:"旧伙伴"}];syncFinance()');g.openPetHub();check(ev('petCareTasks().length')===1&&ev('necessaryPetCareHours()')===1,'unknown blocked others');const self=[...g.document.querySelectorAll('button')].find(b=>b.getAttribute('aria-label')==='阿豆 · 自己洗澡');self.click();button('确认支付已选照顾').click();check(ev('state.cash')===19990&&ev('state.pets[0].care.nextClean')===9&&ev('petCareTasks().length')===0,'care failed');check(!ev('necessaryBills().some(x=>x.kind==="petCare")'),'unknown month gate');pass('未知物种不阻挡已识别宠物10费用/2h护理及必要事项，原护理数值保留');
 const unknown=ev('state.pets[1].id');g.openLegacyPetSpecies(unknown);check(primary().disabled,'mapping no explicit selection');const select=g.document.querySelector('select[aria-label="选择旧宠物物种"]');select.value='gecko';select.dispatchEvent(new g.Event('change'));const mapped=primary().onclick;primary().click();mapped(event());check(ev('state.cash')===19990&&ev('state.pets[1].species')==='gecko'&&ev('state.pets[1].type')==='未知伙伴'&&!ev('state.insurance[state.pets[1].insuranceKey]'),'mapping charged or insured');pass('未知物种手动明确确认免费，原记录保留、不自动投保、不重复执行');
 reset();g.eval('state.pets=[{type:"狗",name:"阿豆"}];state.insurance.pet={active:true,monthly:47,coverage:.65};syncFinance()');const old=ev('JSON.stringify(state.insurance.pet)');g.openPetPolicy(ev('state.pets[0].id'));check(g.document.getElementById('eventTitle').textContent==='阿豆 · 旧合并保障'&&ev('state.cash')===20000,'not blocked by combined');primary().click();check(g.document.getElementById('eventTitle').textContent==='旧合并宠物保单','manage missing');primary().click();check(ev('state.pendingInsuranceChanges.pet.effectiveMonth')===1&&ev('state.insurance.pet.active'),'stop early');primary().click();check(!ev('state.pendingInsuranceChanges.pet'),'revoke');check(ev('JSON.stringify(state.insurance.pet)')===old&&ev('state.cash')===20000,'legacy terms changed');pass('旧47/65%合同保留/阻止重复新投保/次月停保及免费撤销');
 primary().click();g.eval('state.month++;syncFinance()');check(!ev('state.insurance.pet.active')&&!ev('state.insurance[state.pets[0].insuranceKey]'),'auto split after stop');g.openPetPolicy(ev('state.pets[0].id'));button('确认投保').click();check(ev('state.cash')===19970&&ev('state.insurance[state.pets[0].insuranceKey].coverage')===.8,'voluntary current policy');pass('旧保单停保后不自动拆单，玩家主动按现行30/80%投保');
 reset();g.eval('state.pets=[{id:"old-dog",type:"狗",name:"阿豆",insuranceKey:"pet:old-dog"}];state.insurance={pet:{active:true,monthly:47,coverage:1},"pet:old-dog":{active:true,monthly:21,coverage:.8,petId:"old-dog"}};syncFinance()');const contracts=ev('JSON.stringify(state.insurance)');g.openPetHub();check(g.document.getElementById('eventData').textContent.includes('重叠待核对'),'overlap warning');check(ev('JSON.stringify(state.insurance)')===contracts&&ev('MapCards.petQuote(state,"pet-unwell",state.pets[0]).insurance')===160,'stacked payout');check(ev('InsuranceRules.quote(state).monthly')===68,'changed overlapping fee');pass('已有重叠21+47保单保留不删除退款，单次不叠赔且提示待核对');
 reset();g.eval('state.pets=[{type:"狗",name:"阿豆",policyChange:{active:true,monthly:30,effectiveMonth:1}}];state.insurance.pet={active:true,monthly:47};syncFinance()');check(ev('state.pets[0].legacyHeldPolicyChanges.length')===1&&!ev('state.pets[0].policyChange'),'pending lost');g.eval('state.month++;syncFinance();state.insurance.pet.active=false;syncFinance()');check(!ev('state.insurance[state.pets[0].insuranceKey]'),'held request auto enrolled');pass('原未生效预约保留为待核对记录，不在旧合并保单停止后自动开新单');
 reset();g.eval('state.insurance.pet={active:true,monthly:47};syncFinance()');g.previewPetAdoption('dog');const box=g.document.getElementById('petAdoptionInsurance'),name=g.document.getElementById('petAdoptionName');check(box.disabled&&!box.checked,'adoption policy enabled');name.value='新朋友';name.dispatchEvent(new g.Event('input'));const original=ev('state.cash');box.checked=true;box.dispatchEvent(new g.Event('change'));button('确认领养').click();check(ev('state.cash')===original&&ev('state.pets.length')===0,'tampered checkbox duplicate');box.checked=false;box.dispatchEvent(new g.Event('change'));button('确认领养').click();check(ev('state.cash')===19600&&ev('state.pets.length')===1&&!ev('state.insurance[state.pets[0].insuranceKey]'),'adoption fee changed');pass('旧合并有效时领养不附加逐宠险，篡改旧选项不扣款，原领养400保留');
 reset();g.eval('state.pets=[{type:"蜥蜴"}];syncFinance()');g.openPetPolicy(ev('state.pets[0].id'));check(!!g.document.querySelector('[data-document-kind="pets"]'),'unnamed legacy no embedded art');const stale=button('确认投保').onclick;g.clearModals();stale(event());check(ev('state.cash')===20000,'closed old buy');g.openPetPolicy(ev('state.pets[0].id'));const cross=button('确认投保').onclick;g.eval('state=JSON.parse(JSON.stringify(state))');cross(event());check(ev('state.cash')===20000,'cross owner');pass('无名字旧档保留原类型显示，原保险关闭/跨档旧回调不扣款');
 reset();g.Math.random=()=>.99;g.eval('state.pets=[{type:"无法识别",name:"旧伙伴"}];syncFinance();state.turn={month:state.month,index:9,startCash:state.cash};state.town.movement={id:999,to:state.town.position,month:state.month,resolved:false,payExpected:state.month+1};clearModals();');g.settleMonth();check(ev('state.month')===1,'unknown blocked month');pass('未知物种旧档走原真实月结推进一次，不增加历史费用');
 preview();await Promise.all([...g.document.querySelectorAll('.event-active img')].map(i=>i.decode()));out.textContent=JSON.stringify({passed:true,groups:results.length,results,limits:['独立QA新档与合成旧宠物，非用户实际存档','非真机/多年自然游玩/完整断网']},null,2);
}catch(e){out.textContent=JSON.stringify({passed:false,error:String(e),results},null,2)}finally{g.Math.random=random;}}
async function layoutChecks(){const rows=[];try{for(const width of [320,390,800])for(const page of ['pets','combined','unknown']){frame.style.width=width+'px';if(page==='pets')preview();else if(page==='combined')combinedPreview();else{const g=reset();g.eval('state.pets=[{type:"未知伙伴",name:"旧朋友"}];syncFinance()');g.openLegacyPetSpecies(ev('state.pets[0].id'));}await new Promise(requestAnimationFrame);const d=w().document;await Promise.all([...d.querySelectorAll('.event-active img')].map(i=>i.decode()));check(d.documentElement.scrollWidth<=width,'horizontal overflow');rows.push({width,page,horizontalOverflow:false,imagesLoaded:true});}document.getElementById('layout').textContent=JSON.stringify({passed:true,rows},null,2);}catch(e){document.getElementById('layout').textContent=JSON.stringify({passed:false,error:String(e),rows},null,2)}finally{frame.style.width='390px';preview();}}
</script>
